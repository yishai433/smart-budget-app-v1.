services:
  budget-server:
    build: .
    container_name: smart-budget-server
    restart: unless-stopped          # עולה מחדש לבד אחרי הפסקת חשמל / ריסטארט
    environment:
      TZ: Asia/Jerusalem
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      APP_URL: https://yishai433.github.io/smart-budget-app-v1./
      UNUSUAL_MIN: "150"             # ברירת מחדל לסכום "הוצאה גדולה" (כל משתמש קובע לעצמו באפליקציה)
    volumes:
      - ./firebase-key.json:/run/secrets/firebase.json:ro
      - ./data:/app/data
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
